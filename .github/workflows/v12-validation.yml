name: v1.2 evidence lifecycle validation

on:
  push:
    branches:
      - codex/v1.2-evidence-lifecycle
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install plist lint compatibility
        run: |
          sudo tee /usr/bin/plutil >/dev/null <<'PY'
          #!/usr/bin/env python3
          import plistlib
          import sys

          if len(sys.argv) != 3 or sys.argv[1] != "-lint":
              print("usage: plutil -lint path", file=sys.stderr)
              raise SystemExit(2)
          try:
              with open(sys.argv[2], "rb") as handle:
                  plistlib.load(handle)
          except (OSError, plistlib.InvalidFileException) as error:
              print(f"{sys.argv[2]}: {error}", file=sys.stderr)
              raise SystemExit(1) from error
          print(f"{sys.argv[2]}: OK")
          PY
          sudo chmod 755 /usr/bin/plutil
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Full test suite
        run: uv run pytest -q
      - name: Chinese CLI help
        run: |
          uv run mynews --help
          uv run mynews collect --help
          uv run mynews probe --help
          uv run mynews validate --help
          uv run mynews report --help
