[project]
name = "mynews-newsfromai-sources"
version = "0.1.0"
description = "mynews v1.5 newsFromAI RSS and Atom source plugins"
requires-python = ">=3.12,<3.13"
dependencies = ["mynews>=0.1.0,<0.2"]

[project.entry-points."mynews.source_plugins"]
openai-news = "mynews_newsfromai_sources.factories:openai_news"
google-blog = "mynews_newsfromai_sources.factories:google_blog"
github-changelog = "mynews_newsfromai_sources.factories:github_changelog"
hugging-face-blog = "mynews_newsfromai_sources.factories:hugging_face_blog"
google-deepmind = "mynews_newsfromai_sources.factories:google_deepmind"
nvidia-ai = "mynews_newsfromai_sources.factories:nvidia_ai"
aws-machine-learning = "mynews_newsfromai_sources.factories:aws_machine_learning"
kimi-k2-releases = "mynews_newsfromai_sources.factories:kimi_k2_releases"
glm-releases = "mynews_newsfromai_sources.factories:glm_releases"
deepseek-status = "mynews_newsfromai_sources.factories:deepseek_status"
openai-status = "mynews_newsfromai_sources.factories:openai_status"
anthropic-status = "mynews_newsfromai_sources.factories:anthropic_status"
github-status = "mynews_newsfromai_sources.factories:github_status"
techcrunch-ai = "mynews_newsfromai_sources.factories:techcrunch_ai"
paperswithcode-daily = "mynews_newsfromai_sources.factories:paperswithcode_daily"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mynews_newsfromai_sources"]
