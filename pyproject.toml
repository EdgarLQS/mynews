[project]
name = "mynews"
version = "0.1.0"
description = "面向个人使用的 AI 与科技热点收集器"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
mynews = "mynews.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/newsfromai-source-pack/tests"]
pythonpath = ["plugins/newsfromai-source-pack/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mynews"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
